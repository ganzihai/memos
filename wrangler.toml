# Cloudflare Workers 配置文件
name = "memos" # 此处数据库名称改为你需要的名称，否则 wrangler d1 create xxx会报错
main = "worker.js"
compatibility_date = "2023-12-01"

# D1 数据库绑定
[[d1_databases]]
binding = "DB" # 在Worker代码中通过 env.DB 访问
database_name = "memos" # 数据库名称
database_id = "148f736a-f302-4b43-a22b-0c46c94f8b3f" # 替换为你的D1数据库ID

# 环境变量
[env.production.vars]
ENVIRONMENT = "production"

[env.staging.vars]
ENVIRONMENT = "staging"

[env.development.vars]
ENVIRONMENT = "development"

# 静态站点配置（如果使用Cloudflare Pages）
[site]
bucket = "./build" # 构建输出目录

# 自定义域名
[env.production]
routes = [
  { pattern = "n.ganzi.fun", custom_domain = true },
  { pattern = "api.n.ganzi.fun/*", zone_name = "n.ganzi.fun" }
]
# ]
